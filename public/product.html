<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Product — SoukStore</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header id="site-header"></header>
  <main class="container">
    <p><a href="/" style="color:var(--muted)">← Back to shop</a></p>
    <div id="product"></div>
    <h2 id="related-title" hidden>You may also like</h2>
    <div class="grid" id="related"></div>
  </main>
  <footer>Enjoy your shopping with SoukStore ° 2026</footer>

  <script src="/js/app.js"></script>
  <script>
    const id = new URLSearchParams(location.search).get('id');
    const box = document.getElementById('product');

    async function load() {
      try {
        const { product: p, related } = await App.api(`/products/${encodeURIComponent(id)}`);
        document.title = `${p.name} — SoukStore`;
        const stock = p.stock === 0 ? '<span class="stock out">Out of stock</span>'
          : p.stock <= 5 ? `<span class="stock low">Only ${p.stock} left in stock</span>`
          : `<span class="stock">${p.stock} in stock</span>`;
        box.innerHTML = `
          <div class="details">
            ${App.productThumb(p, 'lg')}
            <div class="card">
              <span class="cat" style="color:var(--muted);text-transform:uppercase;font-size:.8rem">${App.esc(p.category)}</span>
              <h1>${App.esc(p.name)}</h1>
              <div class="price">${App.money(p.price)}</div>
              <p>${App.esc(p.description)}</p>
              ${stock}
              <div class="qty">
                <button id="minus" aria-label="Decrease">−</button>
                <input id="qty" type="number" min="1" max="${p.stock}" value="1" ${p.stock === 0 ? 'disabled' : ''}/>
                <button id="plus" aria-label="Increase">+</button>
              </div>
              <button class="btn block" id="add" ${p.stock === 0 ? 'disabled' : ''}>Add to cart</button>
            </div>
          </div>`;
        const qty = document.getElementById('qty');
        const clamp = (v) => Math.max(1, Math.min(p.stock, v || 1));
        document.getElementById('minus').onclick = () => (qty.value = clamp(+qty.value - 1));
        document.getElementById('plus').onclick = () => (qty.value = clamp(+qty.value + 1));
        qty.onchange = () => (qty.value = clamp(+qty.value));
        document.getElementById('add').onclick = () => App.addToCart(p, clamp(+qty.value));

        if (related.length) {
          document.getElementById('related-title').hidden = false;
          document.getElementById('related').innerHTML = related.map((r) => `
            <a class="product-card" href="/product.html?id=${r.id}">
              ${App.productThumb(r)}
              <div class="body"><h3>${App.esc(r.name)}</h3><span class="price">${App.money(r.price)}</span></div>
            </a>`).join('');
        }
      } catch (e) {
        box.innerHTML = `<div class="empty"><div class="big">😕</div>${App.esc(e.message)}</div>`;
      }
    }
    load();
  </script>
</body>
</html>
