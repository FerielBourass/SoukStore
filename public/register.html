<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign up — SoukStore</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header id="site-header"></header>
  <main class="container">
    <div class="card auth-box">
      <h1>Create your account</h1>
      <form id="form">
        <label for="name">Full name</label>
        <input id="name" name="name" required minlength="2" autocomplete="name" />
        <label for="email">Email</label>
        <input id="email" name="email" type="email" required autocomplete="email" />
        <label for="password">Password</label>
        <input id="password" name="password" type="password" required minlength="6" autocomplete="new-password" />
        <div class="error-msg" id="err"></div>
        <button class="btn block" type="submit">Sign up</button>
      </form>
      <p class="alt">Already have an account? <a href="/login.html">Login</a></p>
    </div>
  </main>

  <script src="/js/app.js"></script>
  <script>
    document.getElementById('form').onsubmit = async (e) => {
      e.preventDefault();
      const f = new FormData(e.target);
      try {
        const data = await App.api('/auth/register', {
          method: 'POST',
          body: { name: f.get('name'), email: f.get('email'), password: f.get('password') },
        });
        App.setSession(data);
        location.href = '/';
      } catch (err) {
        document.getElementById('err').textContent = err.message;
      }
    };
  </script>
</body>
</html>
