<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin — SoukStore</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header id="site-header"></header>
  <main class="container">
    <h1>Admin dashboard</h1>
    <div class="tabs">
      <button class="btn" data-tab="orders">Orders</button>
      <button class="btn ghost" data-tab="products">Products</button>
    </div>

    <section id="tab-orders" class="card">
      <div class="table-wrap"><table>
        <thead><tr><th>#</th><th>Customer</th><th>Items</th><th>Total</th><th>Date</th><th>Status</th></tr></thead>
        <tbody id="orders-body"></tbody>
      </table></div>
    </section>

    <section id="tab-products" hidden>
      <form class="card" id="product-form" style="margin-bottom:18px">
        <h3 style="margin:0" id="form-title">Add a product</h3>
        <input type="hidden" name="id" />
        <div class="form-grid">
          <div><label>Name</label><input name="name" required /></div>
          <div><label>Price (TND)</label><input name="price" type="number" step="0.01" min="0" required /></div>
          <div><label>Stock</label><input name="stock" type="number" min="0" required /></div>
          <div><label>Category</label><input name="category" placeholder="Electronics" /></div>
          <div><label>Emoji image</label><input name="image" placeholder="📦" maxlength="8" /></div>
          <div><label>Color</label><input name="color" type="color" value="#6366f1" style="height:42px;padding:4px" /></div>
        </div>
        <label>Description</label><textarea name="description" rows="2"></textarea>
        <div style="display:flex;gap:8px;margin-top:14px">
          <button class="btn" type="submit">Save product</button>
          <button class="btn ghost" type="reset" id="reset-btn">Clear</button>
        </div>
        <div class="error-msg" id="err"></div>
      </form>
      <div class="card table-wrap"><table>
        <thead><tr><th></th><th>Name</th><th>Category</th><th>Price</th><th>Stock</th><th></th></tr></thead>
        <tbody id="products-body"></tbody>
      </table></div>
    </section>
  </main>

  <script src="/js/app.js"></script>
  <script>
    const user = App.getUser();
    if (!user || user.role !== 'admin') location.href = '/login.html?next=/admin.html';

    const STATUSES = ['pending', 'processing', 'shipped', 'delivered', 'cancelled'];
    let products = [];

    // Tabs
    document.querySelectorAll('[data-tab]').forEach((b) => (b.onclick = () => {
      document.querySelectorAll('[data-tab]').forEach((x) => x.classList.toggle('ghost', x !== b));
      document.getElementById('tab-orders').hidden = b.dataset.tab !== 'orders';
      document.getElementById('tab-products').hidden = b.dataset.tab !== 'products';
    }));

    async function loadOrders() {
      const { orders } = await App.api('/orders');
      document.getElementById('orders-body').innerHTML = orders.length ? orders.map((o) => `
        <tr>
          <td>${o.id}</td>
          <td>${App.esc(o.customer_name)}<br><small style="color:var(--muted)">${App.esc(o.shipping_phone)}</small></td>
          <td>${o.items.map((i) => `${i.quantity}× ${App.esc(i.name)}`).join('<br>')}</td>
          <td><b>${App.money(o.total)}</b></td>
          <td>${new Date(o.created_at + 'Z').toLocaleDateString()}</td>
          <td>${o.status === 'cancelled' ? '<span class="status cancelled">cancelled</span>' : `
            <select data-order="${o.id}">${STATUSES.map((s) => `<option ${s === o.status ? 'selected' : ''}>${s}</option>`).join('')}</select>`}
          </td>
        </tr>`).join('') : '<tr><td colspan="6" style="text-align:center;color:var(--muted)">No orders yet.</td></tr>';
    }

    document.getElementById('orders-body').onchange = async (e) => {
      const id = e.target.dataset.order;
      if (!id) return;
      try {
        await App.api(`/orders/${id}/status`, { method: 'PATCH', body: { status: e.target.value } });
        App.toast(`Order #${id} → ${e.target.value}`);
        loadOrders(); loadProducts();
      } catch (err) { App.toast(err.message, 'error'); }
    };

    async function loadProducts() {
      products = (await App.api('/products')).products;
      document.getElementById('products-body').innerHTML = products.map((p) => `
        <tr>
          <td>${App.productThumb(p, 'xs')}</td>
          <td>${App.esc(p.name)}</td>
          <td>${App.esc(p.category)}</td>
          <td>${App.money(p.price)}</td>
          <td>${p.stock}</td>
          <td style="white-space:nowrap">
            <button class="btn ghost sm" data-edit="${p.id}">Edit</button>
            <button class="btn danger sm" data-del="${p.id}">Delete</button>
          </td>
        </tr>`).join('');
    }

    const form = document.getElementById('product-form');
    document.getElementById('products-body').onclick = async (e) => {
      const { edit, del } = e.target.dataset;
      if (edit) {
        const p = products.find((x) => x.id === Number(edit));
        for (const k of ['id', 'name', 'price', 'stock', 'category', 'image', 'color', 'description']) form.elements[k].value = p[k];
        document.getElementById('form-title').textContent = `Edit "${p.name}"`;
        form.scrollIntoView({ behavior: 'smooth' });
      }
      if (del && confirm('Delete this product?')) {
        try { await App.api(`/products/${del}`, { method: 'DELETE' }); App.toast('Product deleted'); loadProducts(); }
        catch (err) { App.toast(err.message, 'error'); }
      }
    };

    document.getElementById('reset-btn').onclick = () => {
      form.elements.id.value = '';
      document.getElementById('form-title').textContent = 'Add a product';
    };

    form.onsubmit = async (e) => {
      e.preventDefault();
      const body = Object.fromEntries(new FormData(form));
      const id = body.id;
      try {
        await App.api(id ? `/products/${id}` : '/products', { method: id ? 'PUT' : 'POST', body });
        App.toast(id ? 'Product updated' : 'Product added');
        form.reset();
        form.elements.id.value = '';
        document.getElementById('form-title').textContent = 'Add a product';
        document.getElementById('err').textContent = '';
        loadProducts();
      } catch (err) { document.getElementById('err').textContent = err.message; }
    };

    if (user && user.role === 'admin') { loadOrders(); loadProducts(); }
  </script>
</body>
</html>
