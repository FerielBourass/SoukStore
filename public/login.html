<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login — SoukStore</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header id="site-header"></header>
  <main class="container">
    <div class="card auth-box">
      <h1>Welcome back</h1>
      <form id="form">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" required autocomplete="email" />
        <label for="password">Password</label>
        <input id="password" name="password" type="password" required autocomplete="current-password" />
        <div class="error-msg" id="err"></div>
        <button class="btn block" type="submit">Login</button>
      </form>
      <p class="alt">No account yet? <a href="/register.html">Create one</a></p>
    </div>
  </main>

  <script src="/js/app.js"></script>
  <script>
    const next = new URLSearchParams(location.search).get('next') || '/';
    document.getElementById('form').onsubmit = async (e) => {
      e.preventDefault();
      const f = new FormData(e.target);
      try {
        const data = await App.api('/auth/login', { method: 'POST', body: { email: f.get('email'), password: f.get('password') } });
        App.setSession(data);
        location.href = next.startsWith('/') ? next : '/';
      } catch (err) {
        document.getElementById('err').textContent = err.message;
      }
    };
  </script>
</body>
</html>
